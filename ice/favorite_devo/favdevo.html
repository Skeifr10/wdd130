<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
         <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>The Bednars</td>
            <td>BYU Idaho 25th Anniversary</td>
            <td>I center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Rob Garrett</td>
            <td>He will make more of you</td>
            <td>I center</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Elder Fantone</td>
            <td>The Battle is the Lord's</td>
            <td>I center</td>
            <td>2026</td>
          </tr>
         </table>
         <h2>Enter Your favorite Devotional</h2>
         <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" name="Enter Speaker's Name" />
          <label for="title">Title:</label>
          <input type="text" id="title" name="Enter Title" />
          <label for="location">Location:</label>
          <input type="text" id="location" name="Enter Location" />
          <label for="year">Year:</label>
          <input type="text" id="year" name="Enter Year" />
         </form>
      </div>
    </main>
  </div>
</body>
</html>
